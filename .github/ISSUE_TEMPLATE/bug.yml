name: Bug / 缺陷
description: Report a reproducible problem / 可复现问题
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: Version / 版本
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      placeholder: OS, CPU architecture, server/client, guest version, model protocol
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and actual result / 步骤与实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / 已脱敏日志
      description: Do not include keys, pair codes, contacts, subscriptions, private screenshots or a full backup.
