name: Complete Windows client factory
on:
  workflow_call:
    inputs:
      retain_complete_candidate:
        description: Retain the complete installer in an unpublished maintainer draft
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: full-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write # Draft input access; the caller already admits this permission.
    outputs:
      artifact: ${{ steps.handoff.outputs.artifact-id }}
      identity: ${{ steps.identity.outputs.sha256 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      AI_PHONE_TEST_TESSERACT: /usr/bin/tesseract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fixed native dependency inputs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PHONE_USE_FACTORY_ASSETS: ${{ vars.AI_PHONE_USE_FACTORY_ASSETS }}
        run: python3 scripts/native_factory_inputs.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Disposable backend build prerequisites
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev ca-certificates unzip python3-pil tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          ./scripts/bootstrap.sh
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' < /dev/null
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Owned disposable image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.9.2
          context: ai-phone-windows-factory
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Full Windows resource and handoff contracts
        run: PYTHONPATH=scripts python3 -m unittest test_windows_client_factory test_client_delivery test_wsl_resources test_wsl_backend
      - name: Assemble and qualify clean backend startup and restart
        env:
          AI_PHONE_DISPOSABLE_QUALIFICATION: '1'
        run: python3 scripts/wsl_backend_qualification.py --with-device-apps
      - name: Seal source-bound backend handoff
        id: identity
        run: |
          set -euo pipefail
          python3 scripts/windows_client_factory.py stage-backend --report dist/wsl-backend-qualification.json --backend .tools/wsl-backend-qualification/assembled/wsl-backend.payload
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from artifact_io import digest
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha256='+digest(Path('dist/windows-backend/windows-backend.json'))+'\n')
          PYCODE
      - name: Transfer only sealed backend bytes to the native Windows builder
        id: handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-backend
          path: |
            dist/windows-backend/windows-backend.json
            dist/windows-backend/wsl-backend.payload
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Retain sanitized backend qualification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-backend-qualification
          path: dist/wsl-backend-qualification.json
          if-no-files-found: warn
          retention-days: 14

  windows-x64:
    needs: backend
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_HTTP_MULTIPLEXING: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      AI_PHONE_BACKEND_IDENTITY: ${{ needs.backend.outputs.identity }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native build and inspection tools
        shell: pwsh
        run: |
          rustup default 1.96.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\7-Zip" >> $env:GITHUB_PATH
          python scripts/bootstrap_bun.py --dependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Acquire the producing job's exact unpublished backend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.backend.outputs.artifact }}
          path: dist/windows-backend
          merge-multiple: true
      - name: Required Windows filesystem contracts without skips
        shell: pwsh
        run: |
          python scripts/required_tests.py test_android_windows_runtime.WindowsAndroidRuntimeTests.test_sdk_component_junction_never_imports_an_outside_tree test_private_files.PrivateFileTests.test_native_windows_acl_rejects_an_extra_world_read_grant
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Required Windows candidate retention without skips
        shell: bash
        run: python3 scripts/required_tests.py test_candidate_retention test_retention_shell
      - name: Assemble native Android and Linux into one inspected EXE
        shell: pwsh
        run: |
          python scripts/windows_client_factory.py build --backend dist/windows-backend --identity $env:AI_PHONE_BACKEND_IDENTITY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain complete-build text receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: complete-windows-build-receipt
          path: dist/windows-full-factory-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain the unpublished complete installer on explicit request
        if: success() && inputs.retain_complete_candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/retain-client-candidate.sh dist/windows-full-factory-report.json
      # Native compilation and unpacking do not claim WSL/WHPX/firewall boot,
      # physical installation, redistribution approval or public binary release.
