name: Native client checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Toolchain and locked dependencies
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          ./scripts/bootstrap.sh
      - name: Native tests and lint
        run: |
          cargo fmt --manifest-path apps/client/src-tauri/Cargo.toml --check
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path apps/client/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Dependency advisories with target evidence
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          python3 scripts/audit_dependencies.py --target aarch64-apple-darwin --output audit.json
      - name: Local unsigned bundle and privacy checks
        run: python3 scripts/build_client.py
      # This workflow never publishes releases or uploads unsigned installers.

  desktop-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup default 1.96.0
      - name: Locked client CLI
        run: npm install --prefix apps/client --ignore-scripts --package-lock=false --no-audit
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Windows inspection tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\7-Zip" >> $env:GITHUB_PATH'
      - name: Native tests
        run: cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --release
      - name: Verify vendored upstream patch and packaging guards
        run: python -m unittest discover -s scripts -p test_native_backports.py
      - name: Build and inspect local preview
        run: python scripts/build_client.py --platform ${{ matrix.platform }}

  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Toolchain
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          rustup default 1.96.0
          rustup target add aarch64-linux-android
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
          npm install --prefix apps/client --ignore-scripts --package-lock=false --no-audit
      - name: Release APK and unpacked payload inspection
        run: python3 scripts/build_client.py --platform android
      # Keys remain ephemeral to this runner. No artifact/release upload or signing identity export.
