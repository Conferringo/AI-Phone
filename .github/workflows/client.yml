name: Native client checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      development_artifacts:
        description: Retain development-only build artifacts for maintainer inspection
        type: boolean
        default: false
      complete_macos_factory:
        description: Assemble the complete Mac client with native ARM64 image builders
        type: boolean
        default: false
      complete_windows_factory:
        description: Assemble one complete Windows EXE with its qualified Linux backend
        type: boolean
        default: false
      retain_complete_candidate:
        description: Retain the complete factory installer in an unpublished maintainer draft
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: client-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ (inputs.complete_macos_factory || inputs.complete_windows_factory) && 'complete' || 'components' }}
  cancel-in-progress: ${{ !(inputs.complete_macos_factory || inputs.complete_windows_factory) }}
jobs:
  full-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.complete_windows_factory
    permissions:
      contents: write
    uses: ./.github/workflows/windows-full-client.yml
    with:
      retain_complete_candidate: ${{ inputs.retain_complete_candidate }}
  macos-arm64:
    if: github.event_name != 'workflow_dispatch' || !(inputs.complete_macos_factory || inputs.complete_windows_factory)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Toolchain and locked dependencies
        run: |
          test "$(uname -m)" = arm64
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from client_artifacts import notice_manifest; notice_manifest()"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          ./scripts/bootstrap.sh
      - name: Native OCR qualification tools
        run: |
          brew install tesseract
          python3 scripts/prepare_ocr_models.py --destination "$RUNNER_TEMP/aiphone-ocr-models"
          echo "AI_PHONE_TEST_TESSERACT=$(command -v tesseract)" >> "$GITHUB_ENV"
          echo "AI_PHONE_TEST_TESSDATA=$RUNNER_TEMP/aiphone-ocr-models" >> "$GITHUB_ENV"
      - name: Native tests and lint
        run: |
          PYTHONPATH=scripts python3 -m unittest test_native_services
          cargo fmt --manifest-path apps/client/src-tauri/Cargo.toml --check
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path apps/client/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Qualify embedded ARM runtime and dependency advisories
        run: |
          set -euo pipefail
          # These tasks share no compiler output or runtime workspace. Join both
          # results before exposing the component to packaging.
          (
            cargo install cargo-audit --version 0.22.2 --locked
            python3 scripts/audit_dependencies.py --target aarch64-apple-darwin --output audit.json
          ) > "$RUNNER_TEMP/aiphone-native-audit.log" 2>&1 &
          audit_pid=$!
          stock="$RUNNER_TEMP/aiphone-android-stock"
          android_result=0
          python3 scripts/android_component_factory.py --work "$stock" --verify-programs --compression-preset 3 --receipt "$RUNNER_TEMP/android-stock-receipt.json" > "$RUNNER_TEMP/android-stock-diagnostic.json" || android_result=$?
          audit_result=0
          wait "$audit_pid" || audit_result=$?
          cat "$RUNNER_TEMP/aiphone-native-audit.log"
          if [ "$android_result" -ne 0 ] || [ "$audit_result" -ne 0 ]; then
            exit 1
          fi
          # Retain the verified capsule and remove only this job's extraction scratch.
          rm -rf "$stock/installation"
          rm "$stock/emulator.zip" "$stock/platform-tools.zip" "$stock/system-image.zip"
          echo "AI_PHONE_FACTORY_ANDROID_PAYLOAD=$stock/android.payload" >> "$GITHUB_ENV"
          echo "Pinned ARM emulator and ADB verified; Android system capsule ready."
      - name: Retain sanitized dependency diagnostics
        if: always() && hashFiles('audit.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-dependency-audit
          path: audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Local unsigned bundle and privacy checks
        run: python3 scripts/build_client.py --with-web-runtime --with-service-runtime --with-js-services --android-runtime "$AI_PHONE_FACTORY_ANDROID_PAYLOAD"
      - name: Stage qualified core services for maintainer deployment
        run: |
          PYTHONPATH=scripts python3 - <<'PYCODE'
          import os
          from pathlib import Path
          from prebuilt_services import prepare_services, load_manifest
          root = Path.cwd()
          destination = Path(os.environ['RUNNER_TEMP']) / 'core-services'
          for name, content, mode in prepare_services(root):
              path = destination / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
              path.chmod(mode)
          load_manifest(destination)
          notices = ['LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md',
                     'docs/public/native-services-licenses.txt',
                     'docs/public/native-services-license-inventory.json',
                     'docs/public/licenses/fixtures/dejavu.txt']
          notices.extend(path.relative_to(root).as_posix() for path in
                         (root / 'docs/public/licenses/rust-runtime').rglob('*') if path.is_file())
          for name in notices:
              path = destination / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes((root / name).read_bytes())
          PYCODE
      # Core services only: no client, Android SDK, guest image or user state.
      - name: Retain qualified core services
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-services-macos-arm64
          path: ${{ runner.temp }}/core-services
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Check bundled runtime publication review
        if: github.event_name == 'workflow_dispatch' && inputs.development_artifacts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path('config/release-policy.json').read_text())
          if policy['publication_gates']['asset_and_source_license_review'] is not True:
              raise SystemExit('Bundled Android runtime requires redistribution/source review before artifact upload')
          PY
      - name: Retain development artifact only on explicit request
        if: github.event_name == 'workflow_dispatch' && inputs.development_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-macos-arm64
          path: dist/AI-Phone-*-macos-arm64.dmg*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  native-arm-images:
    if: github.event_name == 'workflow_dispatch' && inputs.complete_macos_factory
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      candidate_tag: ${{ steps.retain.outputs.candidate_tag }}
      candidate_release_id: ${{ steps.retain.outputs.candidate_release_id }}
      metadata_sha256: ${{ steps.assemble.outputs.metadata_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Disposable native image build space
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(uname -m)" = aarch64
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android/sdk
          df -h .
      - name: Owned native image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.9.2
          context: ai-phone-arm-image-factory
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Source and image handoff contracts
        run: |
          python3 scripts/check_source.py --repository --manifest
          PYTHONPATH=scripts python3 -B -m unittest test_factory_image_candidate test_macos_client_factory
      - name: Build and seal native ARM64 images
        id: assemble
        run: |
          python3 scripts/factory_image_candidate.py build "$RUNNER_TEMP/arm-images" --result "$RUNNER_TEMP/arm-images-result.json"
          identity=$(jq -er .metadata_sha256 "$RUNNER_TEMP/arm-images-result.json")
          printf 'metadata_sha256=%s\n' "$identity" >> "$GITHUB_OUTPUT"
      - name: Retain the source-bound unpublished handoff
        id: retain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=$(jq -er .report "$RUNNER_TEMP/arm-images-result.json")
          bash scripts/retain-client-candidate.sh "$report" factory-images

  full-macos-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.complete_macos_factory
    needs: native-arm-images
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      AI_PHONE_IMAGE_HANDOFF_TAG: ${{ needs.native-arm-images.outputs.candidate_tag }}
      AI_PHONE_IMAGE_HANDOFF_RELEASE_ID: ${{ needs.native-arm-images.outputs.candidate_release_id }}
      AI_PHONE_IMAGE_HANDOFF_IDENTITY: ${{ needs.native-arm-images.outputs.metadata_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Disposable Mac factory toolchain
        run: |
          set -euo pipefail
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from client_artifacts import notice_manifest; notice_manifest()"
          # This hosted job builds only macOS/ARM Linux, so no Android NDK is
          # consumed. Reclaim only this disposable runner's unused compiler SDKs.
          rm -rf "$ANDROID_HOME/ndk"
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add --toolchain 1.96.0 aarch64-unknown-linux-musl
          ./scripts/bootstrap.sh
          brew update
          brew install tesseract
          python3 scripts/prepare_ocr_models.py --destination "$RUNNER_TEMP/aiphone-ocr-models"
          echo "AI_PHONE_TEST_TESSERACT=$(command -v tesseract)" >> "$GITHUB_ENV"
          echo "AI_PHONE_TEST_TESSDATA=$RUNNER_TEMP/aiphone-ocr-models" >> "$GITHUB_ENV"
          export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          df -h .
      - name: Factory ownership and image handoff regressions
        run: PYTHONPATH=scripts python3 -m unittest test_macos_factory_engine test_macos_client_factory test_macos_guest_runtime test_factory_image_candidate
      - name: Acquire the exact unpublished native image component
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/factory_image_candidate.py fetch "$AI_PHONE_IMAGE_HANDOFF_TAG" --release-id "$AI_PHONE_IMAGE_HANDOFF_RELEASE_ID" --identity "$AI_PHONE_IMAGE_HANDOFF_IDENTITY" --work "$RUNNER_TEMP/mac-native-images"
      - name: Build all nine resources and the complete Mac client
        run: python3 scripts/macos_factory_engine.py --compiler-sdk "$ANDROID_HOME" --image-candidate "$RUNNER_TEMP/mac-native-images" --image-metadata-sha256 "$AI_PHONE_IMAGE_HANDOFF_IDENTITY"
      - name: Retain text qualification receipts
        if: always() && hashFiles('dist/macos-factory-engine-report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: complete-macos-build-receipt
          path: |
            dist/macos-factory-engine-report.json
            dist/macos-full-factory-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain the complete unpublished candidate on explicit request
        if: success() && inputs.retain_complete_candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/retain-client-candidate.sh dist/macos-full-factory-report.json
      - name: Retire only this source-bound temporary image handoff
        if: always() && env.AI_PHONE_IMAGE_HANDOFF_TAG != '' && env.AI_PHONE_IMAGE_HANDOFF_RELEASE_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/factory_image_candidate.py discard "$AI_PHONE_IMAGE_HANDOFF_TAG" --release-id "$AI_PHONE_IMAGE_HANDOFF_RELEASE_ID" --identity "$AI_PHONE_IMAGE_HANDOFF_IDENTITY"
      # Candidate drafts contain only inspected installers and their inventories.
      # Signing keys, guest state and accounts never enter retention.

  desktop-packages:
    if: github.event_name != 'workflow_dispatch' || !(inputs.complete_macos_factory || inputs.complete_windows_factory)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_HTTP_MULTIPLEXING: ${{ matrix.platform == 'windows' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup default 1.96.0
      - name: Locked client CLI
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); from client_artifacts import notice_manifest; notice_manifest()"
          python scripts/bootstrap_bun.py --dependencies
      - name: Relocated dependency and archive regressions
        env:
          PYTHONPATH: scripts
        run: python -m unittest test_client_payload test_runtime_integrity test_prebuilt_web test_native_services test_js_dependencies test_js_vendor test_prebuilt_js test_private_files test_windows_private test_windows_acl test_database.DatabaseUnitTests
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev python3-pil tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim patchelf file gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          echo "AI_PHONE_TEST_TESSERACT=/usr/bin/tesseract" >> "$GITHUB_ENV"
      - name: Windows inspection tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\7-Zip" >> $env:GITHUB_PATH'
      - name: Native Windows host ownership and registry adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup component add clippy --toolchain 1.96.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ai-phone-host-runtime --lib wsl:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ai-phone-host-runtime --bin wsl-host --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ai-phone-host-runtime --lib device_bridge:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ai-phone-host-runtime --lib android:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ai-phone-host-runtime --test device_bridge_cli --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p ai-phone-host-runtime --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p ai-phone-host-runtime --bin wsl-host --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Required Windows filesystem contracts without skips
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/required_tests.py test_android_windows_runtime.WindowsAndroidRuntimeTests.test_sdk_component_junction_never_imports_an_outside_tree test_private_files.PrivateFileTests.test_native_windows_acl_rejects_an_extra_world_read_grant
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Required Windows candidate retention without skips
        if: runner.os == 'Windows'
        shell: bash
        run: python3 scripts/required_tests.py test_candidate_retention test_retention_shell
      - name: Native tests
        if: runner.os != 'Windows'
        run: cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked --release
      - name: Native Windows tests with the installer compiler profile
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/required_tests.py test_native_client_cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from build_client import windows_cargo; windows_cargo('test')"
      - name: Verify vendored upstream patch and packaging guards
        run: |
          python -m unittest discover -s scripts -p test_native_backports.py
          python -m unittest discover -s scripts -p test_release_portability.py
      - name: Build and inspect local preview
        if: runner.os == 'Windows'
        run: python scripts/build_client.py --platform ${{ matrix.platform }} --with-web-runtime --with-js-services
      - name: Build and inspect Linux service bundle
        if: runner.os == 'Linux'
        run: python scripts/build_client.py --platform linux --with-web-runtime --with-service-runtime --with-js-services
      - name: Retain development artifact only on explicit request
        if: github.event_name == 'workflow_dispatch' && inputs.development_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/AI-Phone-*.exe*
            dist/AI-Phone-*.deb*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  android-arm64:
    if: github.event_name != 'workflow_dispatch' || !(inputs.complete_macos_factory || inputs.complete_windows_factory)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Toolchain
        shell: bash
        run: |
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from client_artifacts import notice_manifest; notice_manifest()"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          rustup default 1.96.0
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
          python scripts/bootstrap_bun.py --dependencies
      - name: Build and verify phone control applications
        run: python3 scripts/prebuilt_phone.py --build
      - name: Release APK and unpacked payload inspection
        run: python3 scripts/build_client.py --platform android --with-phone-apps
      - name: Retain development artifact only on explicit request
        if: github.event_name == 'workflow_dispatch' && inputs.development_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-android-arm64
          path: |
            dist/AI-Phone-*-android-arm64.apk
            dist/AI-Phone-*-android-arm64.apk.sha256
            dist/AI-Phone-*-android-arm64.apk.manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      # Signing identities remain private. Release publication is a separate reviewed action.
