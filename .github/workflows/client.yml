name: Native client checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      development_artifacts:
        description: Retain development-only build artifacts for maintainer inspection
        type: boolean
        default: false
      complete_macos_factory:
        description: Assemble the complete Mac client with native ARM64 image builders
        type: boolean
        default: false
      complete_windows_factory:
        description: Assemble one complete Windows EXE with its qualified Linux backend
        type: boolean
        default: false
      retain_complete_candidate:
        description: Retain the complete factory installer in an unpublished maintainer draft
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: client-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.complete_macos_factory && 'complete-macos' || inputs.complete_windows_factory && 'complete-windows' || 'components' }}
  cancel-in-progress: ${{ !(inputs.complete_macos_factory || inputs.complete_windows_factory) }}
jobs:
  full-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.complete_windows_factory
    permissions:
      contents: write
    uses: ./.github/workflows/windows-full-client.yml
    with:
      retain_complete_candidate: ${{ inputs.retain_complete_candidate }}
  macos-arm64:
    if: github.event_name != 'workflow_dispatch' || !(inputs.complete_macos_factory || inputs.complete_windows_factory)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Toolchain and locked dependencies
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
          ./scripts/bootstrap.sh
          cargo build --locked -p ai-phone-release-tools --bin release-tools
          ./scripts/bun scripts/prepare-client.ts
      - name: Native OCR qualification tools
        run: |
          brew install tesseract
          ./scripts/bun scripts/prepare-ocr-models.ts --destination "$RUNNER_TEMP/aiphone-ocr-models"
          echo "AI_PHONE_TEST_TESSERACT=$(command -v tesseract)" >> "$GITHUB_ENV"
          echo "AI_PHONE_TEST_TESSDATA=$RUNNER_TEMP/aiphone-ocr-models" >> "$GITHUB_ENV"
      - name: Native tests and lint
        run: |
          cargo build -p ai-phone-host-runtime --bin host-resources --locked
          cargo fmt --manifest-path apps/client/src-tauri/Cargo.toml --check
          cargo test --manifest-path apps/client/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path apps/client/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Qualify embedded ARM runtime and dependency advisories
        run: |
          set -euo pipefail
          # These tasks share no compiler output or runtime workspace. Join both
          # results before exposing the component to packaging.
          (
            cargo install cargo-audit --version 0.22.2 --locked
            ./scripts/bun scripts/audit-dependencies.ts --target aarch64-apple-darwin --output audit.json
          ) > "$RUNNER_TEMP/aiphone-native-audit.log" 2>&1 &
          audit_pid=$!
          stock="$RUNNER_TEMP/aiphone-android-stock"
          android_result=0
          ./scripts/bun scripts/android-component.ts --work "$stock" --verify-programs --compression-preset 3 --receipt "$RUNNER_TEMP/android-stock-receipt.json" > "$RUNNER_TEMP/android-stock-diagnostic.json" || android_result=$?
          audit_result=0
          wait "$audit_pid" || audit_result=$?
          cat "$RUNNER_TEMP/aiphone-native-audit.log"
          if [ "$android_result" -ne 0 ] || [ "$audit_result" -ne 0 ]; then
            exit 1
          fi
          # Retain the verified capsule and remove only this job's extraction scratch.
          rm -rf "$stock/installation"
          rm "$stock/emulator.zip" "$stock/platform-tools.zip" "$stock/system-image.zip"
          echo "AI_PHONE_FACTORY_ANDROID_PAYLOAD=$stock/android.payload" >> "$GITHUB_ENV"
          echo "Pinned ARM emulator and ADB verified; Android system capsule ready."
      - name: Retain sanitized dependency diagnostics
        if: always() && hashFiles('audit.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-dependency-audit
          path: audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Local unsigned bundle and privacy checks
        run: ./scripts/bun scripts/build-client.ts --with-web-runtime --with-service-runtime --android-runtime "$AI_PHONE_FACTORY_ANDROID_PAYLOAD"
      - name: Stage qualified core services for maintainer deployment
        run: |
          ./scripts/bun - <<'TS_STAGE'
          import {mkdirSync,writeFileSync,copyFileSync,readdirSync} from 'node:fs';
          import {join,dirname} from 'node:path';
          import {prepareServices} from './scripts/tooling/native-build';
          const destination=join(process.env.RUNNER_TEMP!,'core-services');
          for(const file of await prepareServices()) {const target=join(destination,file.path);mkdirSync(dirname(target),{recursive:true});writeFileSync(target,file.data,{mode:file.mode});}
          const notices=['LICENSE','NOTICE','THIRD_PARTY_NOTICES.md','docs/public/native-services-licenses.txt','docs/public/native-services-license-inventory.json','docs/public/licenses/fixtures/dejavu.txt'];
          for(const entry of readdirSync('docs/public/licenses/rust-runtime',{recursive:true,withFileTypes:true}))if(entry.isFile())notices.push(join(entry.parentPath,entry.name));
          for(const file of notices){const target=join(destination,file);mkdirSync(dirname(target),{recursive:true});copyFileSync(file,target);}
          TS_STAGE
      # Core services only: no client, Android SDK, guest image or user state.
      - name: Retain qualified core services
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-services-macos-arm64
          path: ${{ runner.temp }}/core-services
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Check bundled runtime publication review
        if: github.event_name == 'workflow_dispatch' && inputs.development_artifacts
        run: |
          ./scripts/bun -e "const policy=await Bun.file('config/release-policy.json').json();if(policy.publication_gates.asset_and_source_license_review!==true)throw Error('Bundled Android redistribution/source review is incomplete');"
      - name: Retain development artifact only on explicit request
        if: github.event_name == 'workflow_dispatch' && inputs.development_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-macos-arm64
          path: dist/AI-Phone-*-macos-arm64.dmg*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  native-arm-images:
    if: github.event_name == 'workflow_dispatch' && inputs.complete_macos_factory
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      candidate_tag: ${{ steps.retain.outputs.candidate_tag }}
      candidate_release_id: ${{ steps.retain.outputs.candidate_release_id }}
      metadata_sha256: ${{ steps.assemble.outputs.metadata_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Disposable native image build space
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(uname -m)" = aarch64
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android/sdk
          df -h .
      - name: Owned native image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.9.2
          context: ai-phone-arm-image-factory
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Source and image handoff contracts
        run: |
          ./scripts/bun scripts/source.ts check --repository --manifest
      - name: Build and seal native ARM64 images
        id: assemble
        run: |
          ./scripts/bun scripts/factory-image-candidate.ts build "$RUNNER_TEMP/arm-images" --result "$RUNNER_TEMP/arm-images-result.json"
          identity=$(jq -er .metadata_sha256 "$RUNNER_TEMP/arm-images-result.json")
          printf 'metadata_sha256=%s\n' "$identity" >> "$GITHUB_OUTPUT"
      - name: Retain the source-bound unpublished handoff
        id: retain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=$(jq -er .report "$RUNNER_TEMP/arm-images-result.json")
          bash scripts/retain-client-candidate.sh "$report" factory-images

  full-macos-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.complete_macos_factory
    needs: native-arm-images
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      AI_PHONE_IMAGE_HANDOFF_TAG: ${{ needs.native-arm-images.outputs.candidate_tag }}
      AI_PHONE_IMAGE_HANDOFF_RELEASE_ID: ${{ needs.native-arm-images.outputs.candidate_release_id }}
      AI_PHONE_IMAGE_HANDOFF_IDENTITY: ${{ needs.native-arm-images.outputs.metadata_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Disposable Mac factory toolchain
        run: |
          set -euo pipefail
          # This hosted job builds only macOS/ARM Linux, so no Android NDK is
          # consumed. Reclaim only this disposable runner's unused compiler SDKs.
          rm -rf "$ANDROID_HOME/ndk"
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add --toolchain 1.96.0 aarch64-unknown-linux-musl
          ./scripts/bootstrap.sh
          brew update
          brew install tesseract
          ./scripts/bun scripts/prepare-ocr-models.ts --destination "$RUNNER_TEMP/aiphone-ocr-models"
          echo "AI_PHONE_TEST_TESSERACT=$(command -v tesseract)" >> "$GITHUB_ENV"
          echo "AI_PHONE_TEST_TESSDATA=$RUNNER_TEMP/aiphone-ocr-models" >> "$GITHUB_ENV"
          export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          df -h .
      - name: Acquire the exact unpublished native image component
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/bun scripts/factory-image-candidate.ts fetch "$AI_PHONE_IMAGE_HANDOFF_TAG" --release-id "$AI_PHONE_IMAGE_HANDOFF_RELEASE_ID" --identity "$AI_PHONE_IMAGE_HANDOFF_IDENTITY" --work "$RUNNER_TEMP/mac-native-images"
      - name: Build the complete Mac client
        run: ./scripts/bun scripts/macos-client-factory.ts --compiler-sdk "$ANDROID_HOME" --image-candidate "$RUNNER_TEMP/mac-native-images" --image-metadata-sha256 "$AI_PHONE_IMAGE_HANDOFF_IDENTITY"
      - name: Retain text qualification receipts
        if: always() && hashFiles('dist/macos-full-factory-report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: complete-macos-build-receipt
          path: |
            dist/macos-full-factory-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain the complete unpublished candidate on explicit request
        if: success() && inputs.retain_complete_candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/retain-client-candidate.sh dist/macos-full-factory-report.json
      - name: Retire only this source-bound temporary image handoff
        if: always() && env.AI_PHONE_IMAGE_HANDOFF_TAG != '' && env.AI_PHONE_IMAGE_HANDOFF_RELEASE_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/bun scripts/factory-image-candidate.ts discard "$AI_PHONE_IMAGE_HANDOFF_TAG" --release-id "$AI_PHONE_IMAGE_HANDOFF_RELEASE_ID" --identity "$AI_PHONE_IMAGE_HANDOFF_IDENTITY"
      # Candidate drafts contain only inspected installers and their inventories.
      # Signing keys, guest state and accounts never enter retention.

  desktop-packages:
    if: github.event_name != 'workflow_dispatch' || !(inputs.complete_macos_factory || inputs.complete_windows_factory)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_HTTP_MULTIPLEXING: ${{ matrix.platform == 'windows' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rust toolchain
        run: rustup default 1.96.0
      - name: Locked client CLI
        shell: bash
        run: |
          ./scripts/bootstrap.sh
          ./scripts/bun -e "import {noticeManifest} from './scripts/tooling/client-build'; noticeManifest()"
      - name: Native host fixture executable
        run: |
          cargo build -p ai-phone-host-runtime --bin host-resources --locked
          cargo build --locked -p ai-phone-release-tools --bin release-tools
          ./scripts/bun scripts/prepare-client.ts
      - name: Windows inspection tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\7-Zip" >> $env:GITHUB_PATH'
      - name: Native Windows host ownership and registry adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup component add clippy --toolchain 1.96.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ai-phone-host-runtime --lib wsl:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ai-phone-host-runtime --bin wsl-host --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ai-phone-host-runtime --lib device_bridge:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ai-phone-host-runtime --lib android:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p ai-phone-host-runtime --test device_bridge_cli --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p ai-phone-host-runtime --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p ai-phone-host-runtime --bin wsl-host --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows tests with the installer compiler profile
        if: runner.os == 'Windows'
        run: ./.tools/bin/bun.exe -e "import {windowsCargo} from './scripts/tooling/client-build'; windowsCargo('test')"
      - name: Build and inspect local preview
        if: runner.os == 'Windows'
        run: ./.tools/bin/bun.exe scripts/build-client.ts --platform ${{ matrix.platform }} --with-web-runtime
      - name: Retain development artifact only on explicit request
        if: github.event_name == 'workflow_dispatch' && inputs.development_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/AI-Phone-*.exe*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  android-arm64:
    # Phone-control helpers run inside the virtual Android guest.
    if: github.event_name != 'workflow_dispatch' || !(inputs.complete_macos_factory || inputs.complete_windows_factory)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Android guest application toolchain
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify virtual-phone control applications
        run: ./scripts/bun scripts/artifacts.ts phone --build
