name: Windows installer runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Windows archive and shared filesystem regressions
        run: python -m unittest test_windows_installer_tools test_android_windows_runtime
      - name: Build, verify and execute bundled Python and Node
        run: python scripts/installer_tool_factory.py --work .tools/windows-installer-runtime --receipt dist/windows-installer-runtime.json
      - name: Retain text qualification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-installer-runtime-receipt
          path: dist/windows-installer-runtime.json
          if-no-files-found: error
          retention-days: 14
