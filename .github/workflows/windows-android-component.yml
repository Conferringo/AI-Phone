name: Windows Android runtime component
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONPATH: scripts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Windows archive and NTFS regressions
        run: python -m unittest test_android_windows_runtime test_android_sdk_repository test_linux_client_factory
      - name: Build, relocate and execute pinned emulator and ADB
        shell: bash
        run: |
          python - <<'PY'
          import os,runpy,sys,trace
          from pathlib import Path
          sys.argv=['scripts/android_component_factory.py','--work','.tools/windows-android-component','--verify-programs','--receipt','dist/windows-android-component.json']
          tracer=trace.Trace(count=True,trace=False,ignoredirs=[sys.prefix])
          tracer.runfunc(runpy.run_path,str(Path('scripts/android_component_factory.py').resolve()),run_name='__main__')
          counts=tracer.results().counts
          with Path('dist/windows-android-runtime.lcov').open('w') as output:
              for name in ('android_component_factory','android_runtime','android_sdk_archive'):
                  path=Path('scripts',name+'.py').resolve();output.write('TN:\nSF:scripts/'+name+'.py\n')
                  for line in sorted(n for n in trace._find_executable_linenos(str(path)) if n is not None):
                      output.write(f'DA:{line},{counts.get((str(path),line),0)}\n')
                  output.write('end_of_record\n')
          PY
      - name: Retain text qualification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-android-runtime-receipt
          path: |
            dist/windows-android-component.json
            dist/windows-android-runtime.lcov
          if-no-files-found: error
          retention-days: 14
      # SDK/image binaries stay on the disposable worker until redistribution review.
