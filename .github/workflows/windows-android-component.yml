name: Windows Android runtime component
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fixed build tooling
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          ./scripts/bootstrap.sh
          cargo build --release --locked -p ai-phone-host-runtime --bin host-resources
          cargo build --locked -p ai-phone-release-tools --bin release-tools
      - name: Build, relocate and execute pinned emulator and ADB
        shell: bash
        run: |
          ./scripts/bun scripts/android-component.ts --work .tools/windows-android-component --verify-programs --receipt dist/windows-android-component.json
      - name: Retain text qualification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-android-runtime-receipt
          path: |
            dist/windows-android-component.json
          if-no-files-found: error
          retention-days: 14
      # SDK/image binaries stay on the disposable worker until redistribution review.
