name: Linux backend checks
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wsl-backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-x64-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_HTTP_MULTIPLEXING: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      AI_PHONE_TEST_TESSERACT: /usr/bin/tesseract
      AIMANITY_CI_OCR_SOURCE: ${{ vars.AIMANITY_CI_OCR_SOURCE || '{}' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Disposable Linux build prerequisites
        run: |
          set -euo pipefail
          # This backend-only job uses fixture phone protocols and does not run
          # Android SDK tools. Keep assembly space by removing that unused SDK
          # from this disposable runner, never from an end user's machine.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev ca-certificates unzip tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          ./scripts/bootstrap.sh
          df -h .
      - name: Owned disposable image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.9.2
          context: ai-phone-wsl-factory
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Admission and lifecycle regressions
        run: |
          cargo build -p ai-phone-host-runtime --bin host-resources --bin image-test-engine --locked
          cargo test --locked -p ai-phone-release-tools --bin release-tools wsl_qualification
          cargo test --locked -p ai-phone-release-tools --test wsl_qualification_cli
          cargo test --locked -p ai-phone-runner
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        if: github.head_ref != '' && fromJSON(env.AIMANITY_CI_OCR_SOURCE).branch == github.head_ref
        with:
          run-id: ${{ fromJSON(env.AIMANITY_CI_OCR_SOURCE).run }}
          artifact-ids: ${{ fromJSON(env.AIMANITY_CI_OCR_SOURCE).artifact }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-linux-runtime
      - name: Read back the approved OCR capsule
        if: github.head_ref != '' && fromJSON(env.AIMANITY_CI_OCR_SOURCE).branch == github.head_ref
        env:
          SOURCE_COMMIT: ${{ fromJSON(env.AIMANITY_CI_OCR_SOURCE).commit }}
          SOURCE_PAYLOAD_SHA: ${{ fromJSON(env.AIMANITY_CI_OCR_SOURCE).sha256 }}
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/verified-linux-runtime"
          ocr="$RUNNER_TEMP/verified-linux-ocr"
          test "$(cat "$runtime/source-commit.txt")" = "$SOURCE_COMMIT"
          printf '%s  %s\n' "$SOURCE_PAYLOAD_SHA" "$runtime/source.payload" | sha256sum -c -
          mkdir "$ocr"
          tar --extract --xz --file "$runtime/source.payload" --directory "$ocr" --strip-components=3 --wildcards 'runtime/services/ocr/*'
          printf 'AIMANITY_CI_OCR_DIRECTORY=%s\n' "$ocr" >> "$GITHUB_ENV"
      - name: Assemble, boot and restart the isolated Linux backend
        env:
          AI_PHONE_DISPOSABLE_QUALIFICATION: '1'
        run: |
          args=()
          if [[ -n "${AIMANITY_CI_OCR_DIRECTORY:-}" ]]; then args+=(--linux-ocr "$AIMANITY_CI_OCR_DIRECTORY"); fi
          ./scripts/bun scripts/wsl-backend-qualification.ts "${args[@]}"
      - name: Retain sanitized qualification receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wsl-backend-qualification-receipt
          path: dist/wsl-backend-qualification.json
          if-no-files-found: warn
          retention-days: 14
      # No rootfs, guest disk, archive, environment, or private test log is uploaded.
