name: Managed Linux host acceptance
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: managed-host-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-x64:
    strategy:
      fail-fast: false
      matrix:
        engine: [existing, managed]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: '2'
      NEXT_TELEMETRY_DISABLED: '1'
      AI_PHONE_REQUIRE_MANAGED_ENGINE: ${{ matrix.engine == 'managed' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ephemeral runner system dependencies
        run: |
          # Reclaim only unused preinstalled tools on this disposable hosted runner.
          # SDK license files remain available for the worker's explicit license check.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev ca-certificates unzip openssh-client qemu-system-x86 qemu-utils ovmf virtiofsd tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim python3-pil libgl1 libnss3 libx11-xcb1 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libasound2t64 acl
          test -c /dev/kvm
          test "$(stat -c '%G' /dev/kvm)" = kvm
          sudo usermod -aG kvm "$(id -un)"
          # Validate group-object/mask access without printing the complete ACL.
          getfacl --omit-header --numeric --absolute-names /dev/kvm | python3 -c '
          import sys
          rows = {line.split("#", 1)[0].strip() for line in sys.stdin}
          if not rows.intersection({"group::rw-", "group::rwx"}):
              raise SystemExit("KVM owning group does not have read/write access")
          masks = {line for line in rows if line.startswith("mask::")}
          if masks and not masks.intersection({"mask::rw-", "mask::rwx"}):
              raise SystemExit("KVM ACL mask does not permit read/write access")
          '
          df -h .
      - name: Linux lifecycle regressions
        run: python3 -m unittest discover -s scripts -p test_linux_services.py -v
      - name: Deploy phone, desktop and backend from the client payload
        run: sg kvm -c 'exec python3 scripts/linux_host_acceptance.py'
      # No guest disks, raw service logs, accounts, token files or screenshots uploaded.
