name: Managed Linux host acceptance
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: managed-host-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-x64:
    strategy:
      fail-fast: false
      matrix:
        engine: [existing, managed]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: '2'
      NEXT_TELEMETRY_DISABLED: '1'
      AI_PHONE_TEST_TESSERACT: /usr/bin/tesseract
      AI_PHONE_REQUIRE_MANAGED_ENGINE: ${{ matrix.engine == 'managed' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ephemeral runner system dependencies
        run: |
          # This job installs its own SDK and toolchain; retain the runner's reviewed licences.
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
          test -d "$ANDROID_HOME/licenses"
          (cd "$ANDROID_HOME/licenses" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/aiphone-sdk-licences.sha256"
          test -s "$RUNNER_TEMP/aiphone-sdk-licences.sha256"
          for folder in /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/lib/android/sdk; do
            if [ -d "$folder" ]; then sudo du -sk "$folder"; fi
          done
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/build-tools /usr/local/lib/android/sdk/platforms \
            /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/platform-tools \
            /usr/local/lib/android/sdk/cmdline-tools /usr/local/lib/android/sdk/sources /usr/local/lib/android/sdk/extras
          (cd "$ANDROID_HOME/licenses" && sha256sum --check "$RUNNER_TEMP/aiphone-sdk-licences.sha256")
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev ca-certificates unzip openssh-client qemu-system-x86 qemu-utils ovmf virtiofsd tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim python3-pil libgl1 libnss3 libx11-xcb1 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libasound2t64 acl
          test -c /dev/kvm
          test "$(stat -c '%G' /dev/kvm)" = kvm
          sudo usermod -aG kvm "$(id -un)"
          # Validate group-object/mask access without printing the complete ACL.
          getfacl --omit-header --numeric --absolute-names /dev/kvm | python3 -c '
          import sys
          rows = {line.split("#", 1)[0].strip() for line in sys.stdin}
          if not rows.intersection({"group::rw-", "group::rwx"}):
              raise SystemExit("KVM owning group does not have read/write access")
          masks = {line for line in rows if line.startswith("mask::")}
          if masks and not masks.intersection({"mask::rw-", "mask::rwx"}):
              raise SystemExit("KVM ACL mask does not permit read/write access")
          '
          df -h .
      - name: Linux lifecycle regressions
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          cargo build -p ai-phone-host-runtime --bin host-resources --locked
          python3 scripts/required_tests.py test_linux_services
      - name: Deploy phone, desktop and backend from the client payload
        run: |
          # Lifecycle tests are finished. The installer builds in its own fresh
          # fixture; retire only this job's compiler cache, retaining its binary.
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$PWD" = "$GITHUB_WORKSPACE"
          test "$(target/debug/host-resources --service-supervision-contract)" = ai-phone-linux-supervision-v2
          du -sh target
          rm -rf -- target/debug/build target/debug/deps target/debug/incremental target/debug/.fingerprint
          test "$(target/debug/host-resources --service-supervision-contract)" = ai-phone-linux-supervision-v2
          df -h .
          # Keep KVM supplementary access and restore the primary GID required by uidmap.
          export AI_PHONE_CI_PRIMARY_GROUP="$(id -gn)"
          sg kvm -c 'exec sg "$AI_PHONE_CI_PRIMARY_GROUP" -c "exec python3 scripts/linux_host_acceptance.py"'
      # No guest disks, raw service logs, accounts, token files or screenshots uploaded.
