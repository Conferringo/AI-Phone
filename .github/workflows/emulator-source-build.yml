name: Linux Emulator source build (manual, unapproved output)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Run one isolated Linux source build; output remains unapproved
        type: boolean
        required: true
        default: false
      retain_source_candidate:
        description: Retain the verified build in an unpublished review draft
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: emulator-source-build-linux
  cancel-in-progress: false
jobs:
  linux-x64:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Isolated producer and real process ownership contracts
        working-directory: scripts/emulator-source-build
        run: |
          python3 -B -m unittest -v test_aosp_emulator_producer.py test_linux_bootstrap.py
          python3 -B qualify_owned_session.py
      - name: Review source inventory before the controlled build
        run: |
          python3 scripts/check_source.py --repository --manifest
          python3 -B -m unittest discover -s scripts -p 'test_*candidate*.py'
      - name: Prepare this disposable hosted runner
        run: |
          test '${{ runner.environment }}' = github-hosted
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          printf 'CARGO_TARGET_DIR=%s/source-retention-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          # Reclaim only these unused preinstalled tools on this ephemeral runner.
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          source_sdk_licences="$RUNNER_TEMP/source-sdk-licences.sha256"
          if [ -d /usr/local/lib/android/sdk/licenses ]; then
            (cd /usr/local/lib/android/sdk/licenses && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$source_sdk_licences"
          fi
          for folder in /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/lib/android/sdk; do
            if [ -d "$folder" ]; then sudo du -sk "$folder"; fi
          done
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/build-tools /usr/local/lib/android/sdk/platforms \
            /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/platform-tools \
            /usr/local/lib/android/sdk/cmdline-tools /usr/local/lib/android/sdk/sources /usr/local/lib/android/sdk/extras
          if [ -s "$source_sdk_licences" ]; then
            (cd /usr/local/lib/android/sdk/licenses && sha256sum --check "$source_sdk_licences")
          fi
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git build-essential python3 python3-pip gnupg ca-certificates qemu-system-x86 ninja-build ccache cmake pkg-config acl xvfb xauth x11-xserver-utils libgl1 libnss3 libx11-xcb1 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libasound2t64
          test -c /dev/kvm
          test "$(stat -c '%G' /dev/kvm)" = kvm
          sudo usermod -aG kvm "$(id -un)"
          getfacl --omit-header --numeric --absolute-names /dev/kvm | python3 -c '
          import sys
          rows = {line.split("#", 1)[0].strip() for line in sys.stdin}
          if not rows.intersection({"group::rw-", "group::rwx"}):
              raise SystemExit("KVM owning group does not have read/write access")
          masks = {line for line in rows if line.startswith("mask::")}
          if masks and not masks.intersection({"mask::rw-", "mask::rwx"}):
              raise SystemExit("KVM ACL mask does not permit read/write access")
          '
          build_parent="$(mktemp -d "$RUNNER_TEMP/emulator-source-XXXXXX")"
          printf 'AI_PHONE_EMULATOR_SOURCE_WORK=%s\n' "$build_parent" >> "$GITHUB_ENV"
      - name: Prepare native artifact retention before source synchronization
        if: ${{ inputs.retain_source_candidate }}
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          cargo build --release --locked -p ai-phone-host-runtime --bin package-volumes
      - name: Qualify the owned headless display before source synchronization
        run: python3 -B scripts/emulator-source-build/qualify_display_session.py
      - name: Synchronize fixed sources, verify and build once
        id: source_build
        run: |
          export AI_PHONE_CI_PRIMARY_GROUP="$(id -gn)"
          sg kvm -c 'exec sg "$AI_PHONE_CI_PRIMARY_GROUP" -c "exec python3 scripts/emulator-source-build/linux_bootstrap.py --work \"$AI_PHONE_EMULATOR_SOURCE_WORK/attempt\""'
      - name: Upload only the sanitized result
        if: ${{ always() && contains(fromJSON('["success","failure","cancelled"]'), steps.source_build.outcome) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: emulator-source-linux-result
          path: ${{ env.AI_PHONE_EMULATOR_SOURCE_WORK }}/attempt/public-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Seal and retain source output on explicit request
        if: ${{ success() && inputs.retain_source_candidate }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/source_emulator_candidate.py stage "$AI_PHONE_EMULATOR_SOURCE_WORK/attempt" > "$RUNNER_TEMP/source-candidate.json"
          report=$(jq -er .report "$RUNNER_TEMP/source-candidate.json")
          scripts/retain-client-candidate.sh "$report" source-emulator
