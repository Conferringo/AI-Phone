[workspace]
members = ["crates/api", "crates/vision", "crates/phone-runner", "crates/assistant", "crates/guest-runtime", "crates/host-runtime", "crates/adb-client"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

