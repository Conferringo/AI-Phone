[package]
name = "ai-phone-client"
version = "0.0.1"
description = "Native client for AImanity"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
name = "ai_phone_native"

[workspace]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
ai-phone-api = { path = "../../../crates/api" }
ai-phone-host-runtime = { path = "../../../crates/host-runtime" }
ai-phone-local-speech = { path = "../../../crates/local-speech" }
base64 = "=0.22.1"
prost = "=0.14.4"
tauri = { version = "=2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "=1.0.28"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "=0.17.14"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
