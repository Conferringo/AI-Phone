<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Phone</title><link rel="stylesheet" href="style.css"><script type="module" src="connection.js"></script></head>
<body><main><div class="setup">
<header><h1 id="title">Set up AI Phone</h1><div id="language" class="language-picker"><button type="button" role="combobox" aria-label="Language / 语言" aria-expanded="false" aria-haspopup="listbox" aria-controls="language-options"><span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div id="language-options" role="listbox" aria-label="Language / 语言" hidden></div></div></header>
<section id="local-panel" aria-labelledby="title">
 <div id="host" class="host"><span id="host-name"></span><span id="host-state"></span></div>
 <div id="checks" class="checks" role="status"></div><p id="host-error" role="alert" hidden></p><form id="local-setup"><div class="devices">
  <fieldset><legend><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg><span data-i18n="phone">Phone</span><small>Android 15</small></legend><div id="phone-fields"></div></fieldset>
  <fieldset><legend><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M12 17v4M7 21h10"/></svg><span data-i18n="desktop">Computer</span><small>Debian · Openbox</small></legend><div id="desktop-fields"></div></fieldset>
 </div><button id="install" type="submit" data-i18n="install">Install on this device</button></form>
 <section id="progress" aria-live="polite" hidden><div class="progress-heading"><span class="spinner" aria-hidden="true"></span><h2 id="phase"></h2></div><p id="progress-error" role="alert" hidden></p><div id="license" hidden><pre tabindex="0"></pre><button id="accept" type="button" data-i18n="accept">Accept</button></div><div class="progress-actions"><button id="retry" type="button" data-i18n="retry" hidden>Retry</button><button id="cancel" class="secondary" type="button" data-i18n="cancel">Stop</button><button id="enter" type="button" data-i18n="enter" hidden>Configure model</button></div></section>
 <button id="existing" class="text-button" type="button" data-i18n="existing">Use an existing deployment</button>
</section>
<form id="connection" hidden><div class="server-field"><label id="label" for="server">Server</label><input id="server" type="url" placeholder="http://" required autocomplete="url" spellcheck="false" aria-describedby="error"><p id="error" role="alert" hidden></p></div><button id="submit" type="submit">Connect</button><button id="back" class="text-button" type="button" data-i18n="back">Back</button></form>
</div></main></body></html>
