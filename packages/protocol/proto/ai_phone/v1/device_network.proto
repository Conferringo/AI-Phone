syntax = "proto3";
package ai_phone.v1;

message DeviceNetworkRequest { string device_id = 1; }
message DeviceNetworkCheck {
  string name = 1;
  bool passed = 2;
  string detail = 3;
  uint64 duration_ms = 4;
}
message DeviceNetworkState {
  string device_id = 1;
  uint64 revision = 2;
  bool enabled = 3;
  bool has_subscription = 4;
  string status = 5;
  string error = 6;
  string core_version = 7;
  bool tun_active = 8;
  uint32 node_count = 9;
  uint64 checked_at_ms = 10;
  repeated DeviceNetworkCheck checks = 11;
}
// Authenticated dedicated read; never expose subscription credentials in state.
message DeviceNetworkCredential { string subscription_url = 1; uint64 revision = 2; }
message DeviceNetworkSaveRequest {
  string device_id = 1;
  uint64 expected_revision = 2;
  bool enabled = 3;
  string subscription_url = 4;
  bool use_saved_subscription = 5;
  string request_id = 6;
}
