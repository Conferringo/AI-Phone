syntax = "proto3";
package ai_phone.v1;

enum VoiceInputProtocol {
  VOICE_INPUT_PROTOCOL_UNSPECIFIED = 0;
  VOICE_INPUT_PROTOCOL_TRANSCRIPTION = 1;
  // One audio-capable chat request returns literal speech and a semantic edit.
  VOICE_INPUT_PROTOCOL_AUDIO_CHAT = 2;
}
message VoiceDraft {
  string base_url = 1;
  string api_key = 2;
  string recognition_model = 3;
  string speech_model = 4;
  string voice = 5;
  string proxy_url = 6;
  VoiceInputProtocol input_protocol = 7;
}
message VoiceSettingsRequest { string agent_id = 1; }
message VoiceSettings {
  string agent_id = 1;
  uint64 revision = 2;
  bool configured = 3;
  string base_url = 4;
  string recognition_model = 5;
  string speech_model = 6;
  string voice = 7;
  string proxy_url = 8;
  VoiceInputProtocol input_protocol = 9;
  bool has_api_key = 10;
}
message VoiceSettingsSaveRequest {
  string agent_id = 1;
  uint64 expected_revision = 2;
  // An empty draft clears voice configuration without deleting its revision.
  VoiceDraft draft = 3;
}
message VoiceCredentialRequest { string agent_id = 1; uint64 expected_revision = 2; }
message VoiceCredential { string api_key = 1; }
message VoiceContext {
  string request_id = 1;
  string literal = 2;
  string text = 3;
}
message VoiceTranscribeRequest {
  string device_id = 1;
  string agent_id = 2;
  uint64 configuration_revision = 3;
  string session_id = 4;
  string utterance_id = 5;
  // 16 kHz mono PCM16 WAV, at most 30 seconds per chunk.
  bytes wav = 6;
  string previous_text = 7;
  repeated VoiceContext context = 8;
}
message VoiceTranscript {
  string literal = 1;
  // For transcription this equals the literal; audio-chat may return an edit.
  string text = 2;
  // Only a receipt supplied in this same capture session's context is accepted.
  string corrects_request_id = 3;
}
message VoiceSpeechRequest {
  string device_id = 1;
  string agent_id = 2;
  uint64 configuration_revision = 3;
  string text = 4;
}
message VoiceAudio { bytes wav = 1; }
