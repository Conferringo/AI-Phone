syntax = "proto3";
package ai_phone.v1;

message ChatAttachment {
  string id = 1;
  string name = 2;
  string media_type = 3;
  uint64 size_bytes = 4;
}
// An accepted transcription revision. Corrections append to history; they never
// replace an accepted message or claim that a device action has been undone.
message ChatVoiceInput {
  string session_id = 1;
  string utterance_id = 2;
  uint32 revision = 3;
  string literal = 4;
  string corrects_request_id = 5;
}
message ChatMessage {
  string id = 1;
  string role = 2;
  string text = 3;
  repeated ChatAttachment attachments = 4;
  string run_id = 5;
  string request_id = 6;
  uint64 ordinal = 7;
  bool active = 8;
  bool has_activity = 9;
  ChatVoiceInput voice = 10;
  // Historical operational notices are preserved separately from dialogue.
  string system_notice = 11;
}
message ChatHistoryRequest {
  string conversation_id = 1;
  string device_id = 2;
  // Zero retains the existing full snapshot for older clients. Window clients
  // request 1..80 rows; ordinals locate pages and are never commit cursors.
  uint32 limit = 3;
  string before_message_id = 4;
  repeated string watch_message_ids = 5;
  repeated string receipt_request_ids = 6;
}
enum ChatWindowKind {
  CHAT_WINDOW_KIND_UNSPECIFIED = 0;
  CHAT_WINDOW_KIND_TAIL = 1;
  CHAT_WINDOW_KIND_BEFORE = 2;
}
// Present only for a partial snapshot. Messages are authoritative ID upserts;
// absence from this window never deletes already loaded conversation history.
message ChatMessageWindow {
  ChatWindowKind kind = 1;
  string next_before_message_id = 2;
  bool has_older = 3;
  // Pagination describes this base page, excluding watched heads and receipts.
  repeated string page_message_ids = 4;
}
enum RunNoticeKind {
  RUN_NOTICE_KIND_UNSPECIFIED = 0;
  RUN_NOTICE_KIND_SYSTEM_FAILURE = 1;
  RUN_NOTICE_KIND_NEEDS_INPUT = 2;
}
message ChatState {
  string conversation_id = 1;
  repeated ChatMessage messages = 2;
  string run_id = 3;
  string run_status = 4;
  string error = 5;
  int64 next_wake_at_ms = 6;
  string agent_id = 7;
  string agent_name = 8;
  string device_id = 9;
  uint64 revision = 10;
  RunNoticeKind notice_kind = 11;
  ChatMessageWindow message_window = 12;
}
message ChatSendRequest {
  string conversation_id = 1;
  string text = 2;
  repeated string attachment_ids = 3;
  string request_id = 4;
  string device_id = 5;
  string agent_id = 6;
  ChatVoiceInput voice = 7;
  // Return only the accepted message and its conversation, device, and run IDs.
  bool receipt_only = 8;
}
message ChatRunRequest { string run_id = 1; }
// A committed conversation change. Fetch history for authoritative content.
message ChatChanged { string conversation_id = 1; }
