syntax = "proto3";
package ai_phone.v1;

enum DeviceBridgeRole {
  DEVICE_BRIDGE_ROLE_UNSPECIFIED = 0;
  DEVICE_BRIDGE_ROLE_HOST = 1;
  DEVICE_BRIDGE_ROLE_GUEST = 2;
}

enum DeviceBridgeService {
  DEVICE_BRIDGE_SERVICE_UNSPECIFIED = 0;
  DEVICE_BRIDGE_SERVICE_ADB = 1;
  DEVICE_BRIDGE_SERVICE_EMULATOR = 2;
}

// Installer-private input, supplied through stdin; never a model tool or argv.
message DeviceBridgeConfig {
  uint32 version = 1;
  DeviceBridgeRole role = 2;
  string bridge_id = 3;
  bytes secret = 4;
  // A selected private IP and port: host listen endpoint or guest peer endpoint.
  string endpoint = 5;
  // Guest-only loopback listeners. Zero selects the existing service ports.
  uint32 adb_port = 6;
  uint32 emulator_port = 7;
}

// One bounded admission per connection, followed by the original byte stream.
message DeviceBridgeOpen {
  uint32 version = 1;
  string bridge_id = 2;
  bytes secret = 3;
  DeviceBridgeService service = 4;
}

message DeviceBridgeOpened {
  bool accepted = 1;
}

// Transport availability only: this is not Android/root/frame readiness.
message DeviceBridgeStarted {
  uint32 version = 1;
  DeviceBridgeRole role = 2;
  string bridge_id = 3;
  string endpoint = 4;
  uint32 adb_port = 5;
  uint32 emulator_port = 6;
}
