[package]
name = "ai-phone-host-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
ai-phone-adb = { path = "../adb-client" }
ai-phone-api = { path = "../api" }
prost = "=0.14.4"
tokio = { version = "1", features = ["process", "signal", "time", "macros", "rt", "net", "io-util", "io-std", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "=1.1.10"
xz2 = { version = "=0.1.7", features = ["static"] }
tar = { version = "=0.4.46", default-features = false }
fs2 = "=0.4.3"
getrandom = "=0.4.3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[target."cfg(windows)".dependencies]
windows-registry = "=0.100.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["process", "fs"] }
