[package]
name = "ai-phone-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ai-phone-adb = { path = "../adb-client" }
ai-phone-vision = { path = "../vision" }
ai-phone-api = { path = "../api" }
axum = "=0.8.9"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
prost = "=0.14.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "=0.22.1"
reqwest = { version = "0.12", default-features = false }
uuid = { version = "1", features = ["v4"] }
roxmltree = "=0.21.1"
fs2 = "=0.4.3"
tonic = { version = "=0.14.9", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "=0.14.9"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
futures-util = "0.3"
rustix = { version = "1", features = ["process"] }
if-addrs = "=0.15.0"

[build-dependencies]
tonic-prost-build = "=0.14.9"
prost-build = "=0.14.4"
protoc-bin-vendored = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
