[package]
name = "ai-phone-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ai-phone-api = { path = "../api" }
axum = "=0.8.9"
prost = "=0.14.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "=0.22.1"
reqwest = { version = "0.12", default-features = false }
uuid = { version = "1", features = ["v4"] }
roxmltree = "=0.21.1"
fs2 = "=0.4.3"

[lints]
workspace = true
