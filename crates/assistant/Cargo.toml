[package]
name = "ai-phone-assistant"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ai-phone-api = { path = "../api" }
axum = { version = "=0.8.9", features = ["multipart"] }
prost = "=0.14.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs", "process", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
futures-util = "0.3"
sha2 = "0.10"
argon2 = "0.5"

[lints]
workspace = true
