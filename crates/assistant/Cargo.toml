[package]
name = "ai-phone-assistant"
version = "0.1.0"
edition.workspace = true
# OS file locking uses the standard library API stabilized in Rust 1.89.
rust-version = "1.89"
publish.workspace = true
license.workspace = true

[dependencies]
ai-phone-vision = { path = "../vision" }
ai-phone-api = { path = "../api" }
ai-phone-adb = { path = "../adb-client" }

ai-phone-host-runtime = { path = "../host-runtime" }
axum = { version = "=0.8.9", features = ["multipart", "ws"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
prost = "=0.14.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
futures-util = "0.3"
getrandom = "=0.4.3"
sha2 = "0.10"
argon2 = "0.5"

[lints]
workspace = true
