[package]
name = "ai-phone-guest-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "desktop-bridge"
path = "src/main.rs"

[dependencies]
atspi = { version = "=0.30.0", default-features = false, features = ["proxies", "tokio", "zbus"] }
base64 = "=0.22.1"
fs2 = "0.4"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
rustix = { version = "1", features = ["process", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "process", "io-util", "io-std", "sync"] }
uuid = { version = "1", features = ["v4"] }
x11rb = { version = "=0.13.2", features = ["xtest"] }

[lints]
workspace = true
